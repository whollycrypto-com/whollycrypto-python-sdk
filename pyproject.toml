[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "whollycrypto"
dynamic = ["version"]
description = "Lightweight Python SDK for the Wholly Crypto self-hosted merchant API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wholly Crypto"}]
keywords = ["whollycrypto", "crypto", "payments", "bitcoin", "lightning", "merchant", "sdk"]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.whollycrypto.com"
Documentation = "https://github.com/whollycrypto-com/whollycrypto-python-sdk#readme"
Source = "https://github.com/whollycrypto-com/whollycrypto-python-sdk"
Issues = "https://github.com/whollycrypto-com/whollycrypto-python-sdk/issues"
Changelog = "https://github.com/whollycrypto-com/whollycrypto-python-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/whollycrypto/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/whollycrypto"]

[tool.hatch.build.targets.sdist]
include = ["/src/whollycrypto", "/pyproject.toml", "/LICENSE", "/README.md", "/SECURITY.md", "/CHANGELOG.md", "/examples", "/docs/payment-methods.md"]

[tool.ruff]
target-version = "py310"
line-length = 110
